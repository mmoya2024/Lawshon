<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Lashawn Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#071a33;--green:#19d66b;--green-dark:#0e9f50;--bg:#f4f7fb;--text:#172033;--muted:#6b7280;--border:#e3e8ef}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.box{width:min(400px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:var(--green);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
h1{margin:0;text-align:center;font-size:21px}
.sub{margin:6px 0 24px;text-align:center;color:var(--muted);font-size:13px}
label{display:block;margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
input{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 12px;font:inherit;margin-bottom:16px;outline:none}
input:focus{border-color:var(--green-dark);box-shadow:0 0 0 3px rgba(25,214,107,.15)}
button{width:100%;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;background:var(--green);color:#062015;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-bottom:16px;padding:11px 12px;border-radius:8px;font-size:13px;background:#fff0f1;color:#991b1b;border:1px solid #fecaca}
.msg.show{display:block}
</style>
</head>
<body>
<div class="box">
  <div class="logo">L</div>
  <h1>Lashawn Academy</h1>
  <p class="sub">Staff sign in</p>
  <div class="msg" id="msg"></div>
  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Sign In</button>
  </form>
</div>

<script>
"use strict";
const SUPABASE_URL = "https://qjfinbftcserrjiedduf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqZmluYmZ0Y3NlcnJqaWVkZHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzOTgzMzksImV4cCI6MjEwNTk3NDMzOX0.WHAkxqTTtzQH_za4OPMWJAILRUUHIL5Akk8900QX5c0";

const SUPER_PAGE = "super-admin.html";   // Super Admin dashboard
const OFFICE_PAGE = "admin.html";        // Office Admin page

const $ = id => document.getElementById(id);
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true}});

function showMsg(t){ const m = $("msg"); m.textContent = t; m.classList.add("show"); }
function hideMsg(){ $("msg").classList.remove("show"); }

async function goToDashboard(){
  let isSuper = false;
  try{ isSuper = (await db.rpc("is_super_admin")).data === true; }catch(_){}
  window.location.replace(isSuper ? SUPER_PAGE : OFFICE_PAGE);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  hideMsg();
  const btn = $("btn");
  btn.disabled = true; btn.textContent = "Signing in...";
  try{
    const {error} = await db.auth.signInWithPassword({
      email: $("email").value.trim().toLowerCase(),
      password: $("password").value
    });
    if(error) throw error;
    await goToDashboard();
  }catch(err){
    showMsg(/invalid/i.test(err.message||"") ? "Incorrect email or password." : (err.message || "Could not sign in."));
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

/* Already signed in? Skip the form. */
db.auth.getSession().then(({data}) => { if(data && data.session) goToDashboard(); });
</script>
</body>
</html>
