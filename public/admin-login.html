<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lashawn Academy | Staff Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#071a33; --navy2:#0d2748; --green:#16c784; --green-dark:#087443;
  --bg:#f4f7fb; --text:#172033; --muted:#68758a; --border:#dce3ed; --danger:#d92d20;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.side{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;border-right:4px solid var(--green)}
.side h1{margin:0 0 10px;font-size:34px;line-height:1.15;font-weight:900;max-width:14ch}
.side p{margin:0;color:#9fb1c8;font-size:15px;max-width:34ch;line-height:1.5}
.wrap{display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px}
.box h2{margin:0 0 6px;font-size:24px}
.box .sub{margin:0 0 24px;color:var(--muted);font-size:14px}
.group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:12px;font-weight:700;color:#44526a}
input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font:inherit;font-size:14px}
input:focus,.btn:focus-visible,.toggle:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.pw{position:relative}
.pw input{padding-right:64px}
.toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:6px 8px}
.btn{width:100%;border:0;background:var(--green);color:#062719;padding:13px;border-radius:8px;font:inherit;font-weight:800;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.notice{display:none;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;background:#fff0ef;color:#9d251b}
.notice.show{display:block}
.notice.info{background:#eef6ff;color:#24547d}
.forgot{display:block;margin-top:14px;text-align:center;font-size:13px;color:var(--green-dark);font-weight:700;background:none;border:0;cursor:pointer;width:100%;font-family:inherit}
@media(max-width:800px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{padding:28px 24px;border-right:0;border-bottom:4px solid var(--green)}
  .side h1{font-size:24px}
}
</style>
</head>
<body>

<aside class="side">
  <h1>Lashawn Academy office</h1>
  <p>Sign in with your staff account to register students, receive payments and track training.</p>
</aside>

<main class="wrap">
  <form class="box" id="loginForm" novalidate>
    <h2>Staff sign in</h2>
    <p class="sub">Use the email and password issued by your administrator.</p>

    <div class="notice" id="notice" role="alert"></div>

    <div class="group">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>

    <div class="group">
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle">Show</button>
      </div>
    </div>

    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <button class="forgot" type="button" id="forgotBtn">Forgot password?</button>
  </form>
</main>

<script>
const SUPABASE_URL = "https://qjfinbftcserrjiedduf.supabase.co";
const SUPABASE_KEY = "sb_publishable_tzXXoqZwC2SXZwhS8km2FQ_pNQcuCW5";
const DB = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ADMIN_PAGE = "office-admin.html";
const $ = id => document.getElementById(id);

function isStaff(u){
  const a = u?.app_metadata || {}, m = u?.user_metadata || {};
  const role = a.role || m.role || "";
  const type = a.account_type || m.account_type || "";
  return ["admin","staff"].includes(role) ||
         ["admin","staff"].includes(type) ||
         m.office_role === "Office Admin";
}

function show(msg, info){
  const n = $("notice");
  n.textContent = msg || "";
  n.className = "notice" + (msg ? " show" : "") + (info ? " info" : "");
}

function setBusy(b){
  $("loginBtn").disabled = b;
  $("loginBtn").textContent = b ? "Signing in..." : "Sign in";
}

$("toggle").addEventListener("click", () => {
  const p = $("password"), showing = p.type === "text";
  p.type = showing ? "password" : "text";
  $("toggle").textContent = showing ? "Show" : "Hide";
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  show("");

  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password) return show("Enter your email and password.");
  if(!DB) return show("Could not reach the server. Check your connection and reload.");

  setBusy(true);
  try{
    const { data, error } = await DB.auth.signInWithPassword({ email, password });

    if(error){
      const bad = /invalid login|invalid credentials/i.test(error.message);
      show(bad ? "Email or password is incorrect." : error.message);
      return;
    }

    if(!isStaff(data.user)){
      await DB.auth.signOut();
      show("This account does not have Office Admin access.");
      return;
    }

    location.replace(ADMIN_PAGE);
  }catch(err){
    console.error(err);
    show("Could not sign in. Try again.");
  }finally{
    setBusy(false);
  }
});

$("forgotBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if(!email) return show("Enter your email above, then select Forgot password.");
  if(!DB) return;
  const { error } = await DB.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname
  });
  if(error) return show(error.message);
  show("If that email has an account, a reset link is on its way.", true);
});

(async function init(){
  if(new URLSearchParams(location.search).get("denied") === "1"){
    show("Office Admin access required. Sign in with a staff account.");
  }
  if(!DB) return;
  const { data: { session } } = await DB.auth.getSession();
  if(session && isStaff(session.user)) location.replace(ADMIN_PAGE);
})();
</script>
</body>
</html>
