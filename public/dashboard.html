<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Lashawn Academy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        .header {
            height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .logout {
            border: 0;
            background: #dc2626;
            color: white;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: 230px;
            background: #111827;
            padding: 20px 0;
        }

        .sidebar a {
            display: block;
            padding: 13px 22px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: white;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin: 0;
            font-size: 28px;
        }

        .welcome p {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.06);
        }

        .card-title {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 800;
        }

        #loading {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f172a;
            color: white;

            font-size: 18px;
        }

        #dashboard {
            display: none;
        }

        .error {
            color: #fca5a5;
            margin-top: 10px;
            font-size: 14px;
        }

        @media(max-width: 700px) {

            .sidebar {
                display: none;
            }

            .main {
                padding: 20px;
            }

            .admin-info span {
                display: none;
            }
        }
    </style>
</head>

<body>

<div id="loading">
    Checking administrator session...
</div>


<div id="dashboard">

    <header class="header">

        <div class="brand">
            🎓 Lashawn Academy
        </div>

        <div class="admin-info">

            <span id="adminName">
                Administrator
            </span>

            <button
                class="logout"
                id="logoutButton"
            >
                Logout
            </button>

        </div>

    </header>


    <div class="layout">

        <aside class="sidebar">

            <a
                href="dashboard.html"
                class="active"
            >
                📊 Dashboard
            </a>

            <a href="students.html">
                👥 Students
            </a>

            <a href="driving.html">
                🚗 Driving
            </a>

            <a href="computer.html">
                💻 Computer
            </a>

            <a href="printing.html">
                🖨️ Printing
            </a>

            <a href="finance.html">
                💰 Finance
            </a>

            <a href="vehicles.html">
                🚙 Vehicles
            </a>

            <a href="staff.html">
                👔 Staff
            </a>

            <a href="reports.html">
                📈 Reports
            </a>

            <a href="settings.html">
                ⚙️ Settings
            </a>

        </aside>


        <main class="main">

            <div class="welcome">

                <h1>
                    Dashboard
                </h1>

                <p>
                    Welcome back,
                    <strong id="welcomeName">
                        Administrator
                    </strong>
                </p>

            </div>


            <div class="cards">

                <div class="card">
                    <div class="card-title">
                        Active Students
                    </div>

                    <div
                        class="card-value"
                        id="activeStudents"
                    >
                        —
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Approaching 6 Weeks
                    </div>

                    <div
                        class="card-value"
                        id="approaching"
                    >
                        —
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Over 6 Weeks
                    </div>

                    <div
                        class="card-value"
                        id="overdue"
                    >
                        —
                    </div>
                </div>


                <div class="card">
                    <div class="card-title">
                        Test Ready
                    </div>

                    <div
                        class="card-value"
                        id="testReady"
                    >
                        —
                    </div>
                </div>

            </div>

        </main>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* ============================================================
   LASHAWN ADMIN DASHBOARD
   ============================================================ */

const SUPABASE_URL =
    "https://qjfinbftcserrjiedduf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tzXXoqZwC2SXZwhS8km2FQ_pNQcuCW5";


const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            autoRefreshToken: true,
            persistSession: true,
            detectSessionInUrl: true
        }
    }
);


/* Elements */

const loading =
    document.getElementById("loading");

const dashboard =
    document.getElementById("dashboard");

const adminName =
    document.getElementById("adminName");

const welcomeName =
    document.getElementById("welcomeName");

const logoutButton =
    document.getElementById("logoutButton");


/* ============================================================
   CHECK ADMIN
   ============================================================ */

async function checkAdmin() {

    try {

        const {
            data: sessionData,
            error: sessionError
        } = await db.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

            window.location.href =
                "admin-login.html";

            return;
        }


        const session =
            sessionData.session;


        if (!session) {

            window.location.href =
                "admin-login.html";

            return;
        }


        console.log(
            "Dashboard authenticated user:",
            session.user
        );


        /* ---------------------------------------------
           GET STAFF PROFILE
        --------------------------------------------- */

        const {
            data: staff,
            error: staffError
        } = await db
            .from("staff")
            .select(`
                id,
                auth_user_id,
                staff_number,
                first_name,
                last_name,
                email,
                role,
                branch_id,
                is_active
            `)
            .eq(
                "auth_user_id",
                session.user.id
            )
            .maybeSingle();


        if (staffError) {

            console.error(
                "Staff lookup error:",
                staffError
            );

            window.location.href =
                "admin-login.html";

            return;
        }


        if (!staff) {

            console.error(
                "No staff profile found."
            );

            await db.auth.signOut();

            window.location.href =
                "admin-login.html";

            return;
        }


        /* ---------------------------------------------
           ACTIVE CHECK
        --------------------------------------------- */

        if (!staff.is_active) {

            await db.auth.signOut();

            window.location.href =
                "admin-login.html";

            return;
        }


        /* ---------------------------------------------
           ADMIN ROLE CHECK
        --------------------------------------------- */

        const adminRoles = [
            "SUPER_ADMIN",
            "ADMIN"
        ];


        if (!adminRoles.includes(staff.role)) {

            await db.auth.signOut();

            window.location.href =
                "admin-login.html";

            return;
        }


        /* ---------------------------------------------
           SAVE SESSION
        --------------------------------------------- */

        sessionStorage.setItem(
            "lashawn_staff",
            JSON.stringify(staff)
        );


        /* ---------------------------------------------
           DISPLAY ADMIN
        --------------------------------------------- */

        const fullName =
            staff.first_name +
            " " +
            staff.last_name;


        adminName.textContent =
            fullName;


        welcomeName.textContent =
            fullName;


        /* ---------------------------------------------
           SHOW DASHBOARD
        --------------------------------------------- */

        loading.style.display =
            "none";

        dashboard.style.display =
            "block";


        console.log(
            "Admin dashboard loaded successfully."
        );

    }

    catch (error) {

        console.error(
            "Dashboard authentication error:",
            error
        );

        window.location.href =
            "admin-login.html";
    }
}


/* ============================================================
   LOGOUT
   ============================================================ */

logoutButton.addEventListener(
    "click",
    async function () {

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Logging out...";


        sessionStorage.removeItem(
            "lashawn_staff"
        );


        await db.auth.signOut();


        window.location.href =
            "admin-login.html";
    }
);


/* START */

checkAdmin();

</script>

</body>
</html>
