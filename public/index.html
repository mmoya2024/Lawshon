<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enroll — Lashawn Academy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a class="brand" href="index.html">🎓 <span>Lashawn Driving <span class="dot">&</span> Computer College</span></a>
  <nav><a href="index.html">Home</a><a href="courses-ntsa.html">Courses</a></nav>
</header>
<section style="max-width:600px;">
  <h2>Enroll Now</h2>
  <p class="subtitle">Fill in your details and our team will contact you.</p>
  <div class="card">
    <div id="enrollAlert"></div>
    <form id="enrollForm">
      <div class="form-group"><label>Full Name *</label><input type="text" id="eName" required></div>
      <div class="form-group"><label>Phone *</label><input type="tel" id="ePhone" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="eEmail"></div>
      <div class="form-group"><label>Programme *</label>
        <select id="eProgramme" required>
          <option value="">Select...</option>
          <option value="DRIVING">Driving</option>
          <option value="COMPUTER">Computer</option>
        </select>
      </div>
      <div class="form-group"><label>Message</label><textarea id="eMessage" rows="3"></textarea></div>
      <button type="submit" class="btn full">Submit Enquiry</button>
    </form>
  </div>
</section>
<footer style="text-align:center;color:var(--muted);font-size:0.95rem;padding:2.5rem 1.5rem;">
  Lashawn Driving & Computer College · <a href="mailto:info@lashawnacademy.com">info@lashawnacademy.com</a>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
document.getElementById("enrollForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("enrollAlert");
  const name = document.getElementById("eName").value.trim();
  const phone = document.getElementById("ePhone").value.trim();
  const email = document.getElementById("eEmail").value.trim();
  const programme = document.getElementById("eProgramme").value;
  const message = document.getElementById("eMessage").value.trim();

  // Store as a notification record for staff follow-up
  const { error } = await LashawnDB.from("notifications").insert({
    notification_type: "ENROLLMENT_ENQUIRY",
    channel: "WEB",
    recipient: phone,
    subject: `New enrolment enquiry: ${name}`,
    message: `Programme: ${programme}\nPhone: ${phone}\nEmail: ${email || "—"}\nMessage: ${message || "—"}`,
    status: "PENDING",
  });

  if (error) {
    alertBox.innerHTML = '<div class="alert alert-danger">Could not submit. Please try again or call us.</div>';
    return;
  }
  alertBox.innerHTML = '<div class="alert alert-success">Thank you! We will contact you shortly.</div>';
  e.target.reset();
});
</script>
</body>
</html>
