<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Lashawn Academy</title>

    <meta name="theme-color" content="#0f172a">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #172554
                );

            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            border-radius: 20px;

            font-size: 38px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.30);
        }

        .brand h1 {
            font-size: 27px;
            font-weight: 800;
        }

        .brand p {
            margin-top: 6px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 34px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.35);
        }

        .card h2 {
            font-size: 23px;
            margin-bottom: 7px;
            color: #111827;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .admin-badge {
            display: inline-block;

            margin-bottom: 20px;

            padding: 6px 10px;

            border-radius: 999px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 12px;
            font-weight: 700;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;
            font-weight: 650;
        }

        input {
            width: 100%;
            height: 49px;

            padding: 0 14px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,.12);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #2563eb;

            font-weight: 700;
            font-size: 12px;

            cursor: pointer;
        }

        .message {
            min-height: 24px;

            margin: 12px 0;

            padding: 0;

            font-size: 13px;
            line-height: 1.5;

            text-align: center;
        }

        .message.error {
            color: #dc2626;
        }

        .message.success {
            color: #16a34a;
        }

        .message.info {
            color: #2563eb;
        }

        .login-button {
            width: 100%;
            height: 50px;

            border: 0;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: 750;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .security {
            margin-top: 22px;
            padding-top: 18px;

            border-top: 1px solid #e2e8f0;

            text-align: center;

            color: #64748b;

            font-size: 12px;
            line-height: 1.6;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: white;
        }

        .spinner {
            width: 16px;
            height: 16px;

            display: inline-block;

            margin-right: 7px;

            vertical-align: middle;

            border: 2px solid rgba(255,255,255,.4);
            border-top-color: white;

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:480px) {

            .card {
                padding: 26px 22px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">

        <div class="logo">
            🎓
        </div>

        <h1>Lashawn Academy</h1>

        <p>
            Driving & Computer College
        </p>

    </div>


    <div class="card">

        <span class="admin-badge">
            ADMINISTRATION PORTAL
        </span>

        <h2>Administrator Login</h2>

        <p class="subtitle">
            Sign in to manage Lashawn Academy.
        </p>


        <form id="adminLoginForm">

            <div class="field">

                <label for="email">
                    Administrator Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="admin@lashawnacademy.com"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>


            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                Sign In
            </button>

        </form>


        <div class="security">
            🔒 Secure administrator access<br>
            Authorized Lashawn Academy administrators only.
        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to website
    </a>

</div>


<!-- Supabase library loaded directly -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* ============================================================
   LASHAWN ACADEMY ADMIN LOGIN
   ============================================================ */

const SUPABASE_URL =
    "https://qjfinbftcserrjiedduf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tzXXoqZwC2SXZwhS8km2FQ_pNQcuCW5";


const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            autoRefreshToken: true,
            persistSession: true,
            detectSessionInUrl: true
        }
    }
);


/* Elements */

const form =
    document.getElementById("adminLoginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");


/* Message */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* Password visibility */

showPassword.addEventListener(
    "click",
    function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            showPassword.textContent = "Hide";

        } else {

            passwordInput.type = "password";

            showPassword.textContent = "Show";

        }

    }
);


/* ============================================================
   LOGIN
   ============================================================ */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const email =
            emailInput.value.trim().toLowerCase();

        const password =
            passwordInput.value;


        if (!email) {

            showMessage(
                "Please enter your email address."
            );

            emailInput.focus();

            return;
        }


        if (!password) {

            showMessage(
                "Please enter your password."
            );

            passwordInput.focus();

            return;
        }


        loginButton.disabled = true;

        loginButton.innerHTML =
            '<span class="spinner"></span>Signing in...';

        showMessage(
            "Authenticating...",
            "info"
        );


        try {

            /* ---------------------------------------------
               AUTHENTICATE WITH SUPABASE
            --------------------------------------------- */

            const {
                data,
                error
            } = await db.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {

                console.error(
                    "Supabase login error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Invalid email or password."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

                return;
            }


            if (!data || !data.user) {

                showMessage(
                    "Login failed. No user was returned."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

                return;
            }


            const user =
                data.user;


            console.log(
                "Authenticated user:",
                user
            );


            /* ---------------------------------------------
               FIND STAFF PROFILE
            --------------------------------------------- */

            const {
                data: staff,
                error: staffError
            } = await db
                .from("staff")
                .select(`
                    id,
                    auth_user_id,
                    staff_number,
                    first_name,
                    last_name,
                    email,
                    role,
                    branch_id,
                    is_active
                `)
                .eq(
                    "auth_user_id",
                    user.id
                )
                .maybeSingle();


            if (staffError) {

                console.error(
                    "Staff lookup error:",
                    staffError
                );

                await db.auth.signOut();

                showMessage(
                    "Unable to load administrator profile. " +
                    staffError.message
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

                return;
            }


            if (!staff) {

                await db.auth.signOut();

                showMessage(
                    "This account is not linked to a Lashawn Academy staff profile."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

                return;
            }


            /* ---------------------------------------------
               ACTIVE CHECK
            --------------------------------------------- */

            if (!staff.is_active) {

                await db.auth.signOut();

                showMessage(
                    "This administrator account is inactive."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

                return;
            }


            /* ---------------------------------------------
               ADMIN CHECK
            --------------------------------------------- */

            const allowedRoles = [
                "SUPER_ADMIN",
                "ADMIN"
            ];


            if (!allowedRoles.includes(staff.role)) {

                await db.auth.signOut();

                showMessage(
                    "You do not have administrator access."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

                return;
            }


            /* ---------------------------------------------
               SAVE STAFF SESSION
            --------------------------------------------- */

            sessionStorage.setItem(
                "lashawn_staff",
                JSON.stringify(staff)
            );


            showMessage(
                "Welcome " +
                staff.first_name +
                ". Opening administration dashboard...",
                "success"
            );


            /* ---------------------------------------------
               ADMIN DASHBOARD
            --------------------------------------------- */

            setTimeout(
                function () {

                    window.location.href =
                        "dashboard.html";

                },
                700
            );

        }

        catch (error) {

            console.error(
                "Admin login exception:",
                error
            );

            try {
                await db.auth.signOut();
            } catch (e) {}

            showMessage(
                error.message ||
                "Unable to sign in."
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "Sign In";
        }

    }
);

</script>

</body>
</html>
