<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login — Lashawn Driving & Computer College</title>

    <style>
        :root {
            --blue: #1455d9;
            --dark: #0b1730;
            --border: #dfe5ee;
            --text: #172033;
            --muted: #697386;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0b1730 0%,
                    #12356e 55%,
                    #1455d9 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        .wrap {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .brand img {
            height: 84px;
            max-width: 160px;
            object-fit: contain;
            background: white;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
        }

        .brand h1 span {
            color: #6ee7a1;
        }

        .brand p {
            margin: 6px 0 0;
            color: #cbd7e8;
            font-size: 13px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .28);
        }

        .card h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .sub {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font: inherit;
            color: var(--text);
        }

        .field input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(20, 85, 217, .1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--blue);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 13px 16px;
            background: var(--blue);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .forgot-button {
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--blue);
            margin-top: 14px;
            cursor: pointer;
            font-size: 13px;
        }

        .notice {
            padding: 11px 13px;
            border-radius: 9px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.45;
        }

        .notice.error {
            background: #fdecec;
            color: #9d2020;
        }

        .notice.success {
            background: #e8f7ee;
            color: #126d35;
        }

        .notice.info {
            background: #eaf1ff;
            color: #1f4da6;
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            color: #cbd7e8;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 18px;
        }

        .footer a {
            color: white;
            text-decoration: none;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: -3px;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="wrap">

    <div class="brand">

        <img
            src="images/logo.png"
            alt="Lashawn Academy logo"
            onerror="this.style.display='none'"
        >

        <h1>
            Lashawn <span>Academy</span>
        </h1>

        <p>
            Driving School &amp; Computer College
        </p>

    </div>


    <div class="card">

        <h2>Staff Login</h2>

        <p class="sub">
            Sign in to manage students, enrolments,
            fees and payments.
        </p>


        <div
            id="notice"
            class="hidden"
            role="alert"
            aria-live="polite"
        ></div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword"
                        class="show-button"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                id="loginButton"
                type="submit"
                class="login-button"
            >
                Sign In
            </button>


            <button
                id="forgotButton"
                type="button"
                class="forgot-button"
            >
                Forgot password?
            </button>

        </form>

    </div>


    <div class="footer">

        Lashawn Driving &amp; Computer College

        <br>

        <a href="index.html">
            &larr; Back to website
        </a>

    </div>

</div>


<!-- =========================================================
     SUPABASE CDN
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
"use strict";


/* =========================================================
   LASHAWN SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://qjfinbftcserrjiedduf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tzXXoqZwC2SXZwhS8km2FQ_pNQcuCW5";


/* =========================================================
   CREATE SUPABASE CLIENT DIRECTLY
   ========================================================= */

let DB = null;


console.log("======================================");
console.log("LASHAWN LOGIN STARTING");
console.log("======================================");


if (
    typeof window.supabase === "undefined"
) {

    console.error(
        "Supabase CDN did not load."
    );

} else {

    try {

        DB =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        console.log(
            "Lashawn Supabase client created successfully."
        );


        console.log(
            "Supabase URL:",
            SUPABASE_URL
        );


    } catch (error) {

        console.error(
            "Failed to create Supabase client:",
            error
        );

    }

}


/* =========================================================
   ELEMENTS
   ========================================================= */

const notice =
    document.getElementById("notice");

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const showPasswordButton =
    document.getElementById("showPassword");

const forgotButton =
    document.getElementById("forgotButton");


/* =========================================================
   NOTICE
   ========================================================= */

function showNotice(message, type) {

    notice.className =
        "notice " + type;

    notice.textContent =
        message;

}


function clearNotice() {

    notice.className =
        "hidden";

    notice.textContent =
        "";

}


/* =========================================================
   BUTTON
   ========================================================= */

function setBusy(busy) {

    loginButton.disabled =
        busy;

    if (busy) {

        loginButton.innerHTML =
            '<span class="spinner"></span>Signing in...';

    } else {

        loginButton.textContent =
            "Sign In";

    }

}


/* =========================================================
   STAFF ROLE CHECK
   ========================================================= */

function hasOfficeAdminAccess(user) {

    if (!user) {
        return false;
    }


    const app =
        user.app_metadata || {};

    const metadata =
        user.user_metadata || {};


    const role =
        app.role ||
        metadata.role ||
        "";


    const accountType =
        app.account_type ||
        metadata.account_type ||
        "";


    const officeRole =
        metadata.office_role ||
        "";


    console.log(
        "User role:",
        role
    );

    console.log(
        "Account type:",
        accountType
    );

    console.log(
        "Office role:",
        officeRole
    );


    return (

        role === "admin" ||

        role === "staff" ||

        accountType === "admin" ||

        accountType === "staff" ||

        officeRole === "Office Admin"

    );

}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

function getErrorMessage(error) {

    if (!error) {
        return "Unable to sign in.";
    }


    const message =
        error.message || "";


    const lower =
        message.toLowerCase();


    if (
        lower.includes(
            "invalid login credentials"
        )
    ) {

        return "Invalid email or password.";

    }


    if (
        lower.includes(
            "email not confirmed"
        )
    ) {

        return "The email address has not been confirmed.";

    }


    if (
        lower.includes(
            "failed to fetch"
        )
    ) {

        return "Network error. Check your internet connection.";

    }


    if (
        lower.includes(
            "rate limit"
        )
    ) {

        return "Too many login attempts. Please wait and try again.";

    }


    return message;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(event) {

    event.preventDefault();

    clearNotice();


    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email) {

        showNotice(
            "Please enter your email address.",
            "error"
        );

        emailInput.focus();

        return;

    }


    if (!password) {

        showNotice(
            "Please enter your password.",
            "error"
        );

        passwordInput.focus();

        return;

    }


    if (!DB) {

        showNotice(
            "Supabase connection is unavailable.",
            "error"
        );

        console.error(
            "DB is null."
        );

        return;

    }


    setBusy(true);


    try {

        console.log(
            "Signing in:",
            email
        );


        const result =
            await DB.auth.signInWithPassword({

                email: email,

                password: password

            });


        console.log(
            "Supabase response:",
            result
        );


        if (result.error) {

            throw result.error;

        }


        if (
            !result.data ||
            !result.data.session ||
            !result.data.user
        ) {

            throw new Error(
                "Authentication succeeded but no session was returned."
            );

        }


        const user =
            result.data.user;


        console.log(
            "Authenticated:",
            user.email
        );


        console.log(
            "User ID:",
            user.id
        );


        console.log(
            "App metadata:",
            user.app_metadata
        );


        console.log(
            "User metadata:",
            user.user_metadata
        );


        if (
            !hasOfficeAdminAccess(user)
        ) {

            await DB.auth.signOut();


            throw new Error(
                "This account does not have Office Admin access."
            );

        }


        showNotice(
            "Login successful. Opening Office Admin...",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "admin.html";

            },
            500
        );


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        showNotice(
            getErrorMessage(error),
            "error"
        );


        setBusy(false);

    }

}


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

async function forgotPassword() {

    clearNotice();


    const email =
        emailInput.value.trim();


    if (!email) {

        showNotice(
            "Enter your email address first.",
            "info"
        );

        emailInput.focus();

        return;

    }


    if (!DB) {

        showNotice(
            "Supabase connection is unavailable.",
            "error"
        );

        return;

    }


    try {

        const result =
            await DB.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        window.location.pathname
                }
            );


        if (result.error) {

            throw result.error;

        }


        showNotice(
            "If the account exists, a password reset link has been sent.",
            "success"
        );


    } catch (error) {

        console.error(
            "PASSWORD RESET ERROR:",
            error
        );


        showNotice(
            getErrorMessage(error),
            "error"
        );

    }

}


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

showPasswordButton.addEventListener(
    "click",
    function () {

        const isPassword =
            passwordInput.type === "password";


        if (isPassword) {

            passwordInput.type =
                "text";

            showPasswordButton.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

            showPasswordButton.textContent =
                "Show";

        }

    }
);


/* =========================================================
   EVENTS
   ========================================================= */

loginForm.addEventListener(
    "submit",
    login
);


forgotButton.addEventListener(
    "click",
    forgotPassword
);


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession() {

    if (!DB) {

        console.error(
            "Cannot check session because DB is unavailable."
        );

        return;

    }


    try {

        const result =
            await DB.auth.getSession();


        console.log(
            "Current session:",
            result.data.session
        );


        if (
            result.data &&
            result.data.session &&
            result.data.session.user
        ) {

            const user =
                result.data.session.user;


            if (
                hasOfficeAdminAccess(user)
            ) {

                console.log(
                    "Existing Office Admin session found."
                );


                window.location.href =
                    "admin.html";


                return;

            }


            await DB.auth.signOut();

        }

    } catch (error) {

        console.error(
            "SESSION CHECK ERROR:",
            error
        );

    }

}


/* =========================================================
   START
   ========================================================= */

checkSession();

</script>

</body>
</html>
