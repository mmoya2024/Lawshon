<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — Lashawn Driving & Computer College</title>

<style>
:root{
  --navy:#0b1730;
  --blue:#1455d9;
  --green:#159447;
  --bg:#f4f7fb;
  --card:#ffffff;
  --border:#dfe5ee;
  --text:#172033;
  --muted:#697386;
  --danger:#c62828;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:
    linear-gradient(135deg,#0b1730 0%,#12356e 55%,#1455d9 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:var(--text);
}

.login-wrap{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  color:#fff;
  margin-bottom:20px;
}

.brand-icon{
  font-size:45px;
  margin-bottom:5px;
}

.brand h1{
  margin:0;
  font-size:28px;
  font-weight:800;
}

.brand h1 span{
  color:#6ee7a1;
}

.brand p{
  margin:7px 0 0;
  color:#cbd7e8;
  font-size:13px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:30px;
  box-shadow:0 25px 70px rgba(0,0,0,.28);
}

.card h2{
  margin:0 0 7px;
  font-size:22px;
}

.subtitle{
  margin:0 0 22px;
  color:var(--muted);
  font-size:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:17px;
}

.field label{
  font-size:13px;
  font-weight:700;
}

.field input{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  font:inherit;
  color:var(--text);
}

.field input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(20,85,217,.10);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:70px;
}

.show-password{
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--blue);
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px 16px;
  background:var(--blue);
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.btn:hover{
  filter:brightness(.96);
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.notice{
  padding:11px 13px;
  border-radius:9px;
  margin-bottom:17px;
  font-size:13px;
  line-height:1.45;
}

.notice.error{
  background:#fdecec;
  color:#9d2020;
}

.notice.success{
  background:#e8f7ee;
  color:#126d35;
}

.notice.info{
  background:#eaf1ff;
  color:#1f4da6;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#cbd7e8;
  font-size:12px;
  margin-top:18px;
}

.footer a{
  color:#fff;
  text-decoration:none;
}

.spinner{
  display:inline-block;
  width:15px;
  height:15px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:-3px;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:480px){
  .card{
    padding:23px;
  }

  .brand h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="login-wrap">

  <div class="brand">
    <div class="brand-icon">🎓</div>

    <h1>
      Lashawn <span>Academy</span>
    </h1>

    <p>
      Driving & Computer College
    </p>
  </div>


  <div class="card">

    <h2>Office Admin Login</h2>

    <p class="subtitle">
      Sign in to manage students, enrolments, fees and payments.
    </p>


    <div id="notice" class="hidden"></div>


    <form id="loginForm">

      <div class="field">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Enter your email address"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="togglePassword"
          >
            Show
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="btn"
        id="loginBtn"
      >
        Sign In
      </button>

    </form>

  </div>


  <div class="footer">

    Lashawn Driving & Computer College

    <br>

    <a href="index.html">
      ← Back to website
    </a>

  </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your existing Supabase configuration -->
<script src="js/supabase.js"></script>

<script>

const DB = window.LashawnDB;

const $ = id => document.getElementById(id);


/* -----------------------------------------
   SHOW MESSAGE
----------------------------------------- */

function showNotice(message,type="info"){

  const box = $("notice");

  box.className = "notice " + type;

  box.textContent = message;

  box.classList.remove("hidden");

}


/* -----------------------------------------
   HIDE MESSAGE
----------------------------------------- */

function hideNotice(){

  const box = $("notice");

  box.className = "hidden";

  box.textContent = "";

}


/* -----------------------------------------
   LOGIN
----------------------------------------- */

async function login(event){

  event.preventDefault();

  hideNotice();

  const email =
    $("email").value.trim();

  const password =
    $("password").value;


  if(!email || !password){

    showNotice(
      "Please enter your email address and password.",
      "error"
    );

    return;
  }


  if(!DB || !DB.auth){

    showNotice(
      "Supabase is not configured. Please check js/supabase.js.",
      "error"
    );

    return;
  }


  const button =
    $("loginBtn");


  button.disabled = true;

  button.innerHTML =
    '<span class="spinner"></span>Signing in...';


  try{

    const {
      data,
      error
    } =
    await DB.auth.signInWithPassword({
      email:email,
      password:password
    });


    if(error){

      throw error;

    }


    if(!data || !data.session){

      throw new Error(
        "Login succeeded but no active session was created."
      );

    }


    showNotice(
      "Login successful. Opening Office Admin...",
      "success"
    );


    /*
      Give Supabase a moment to persist
      the authenticated session.
    */

    await new Promise(
      resolve => setTimeout(resolve,500)
    );


    /*
      IMPORTANT:

      Office Admin goes to admin.html.

      admin.html itself contains:

          requireAdminAccess()

      so the protected page remains protected.
    */

    window.location.replace(
      "admin.html"
    );


  }catch(error){

    console.error(
      "Login error:",
      error
    );


    let message =
      error?.message ||
      "Unable to sign in.";


    if(
      message
        .toLowerCase()
        .includes("invalid login credentials")
    ){

      message =
        "Invalid email or password.";

    }


    showNotice(
      message,
      "error"
    );


    button.disabled = false;

    button.textContent =
      "Sign In";

  }

}


/* -----------------------------------------
   SHOW / HIDE PASSWORD
----------------------------------------- */

$("togglePassword").addEventListener(
  "click",
  function(){

    const input =
      $("password");

    if(input.type === "password"){

      input.type = "text";

      this.textContent =
        "Hide";

    }else{

      input.type = "password";

      this.textContent =
        "Show";

    }

  }
);


/* -----------------------------------------
   SUBMIT
----------------------------------------- */

$("loginForm").addEventListener(
  "submit",
  login
);


/* -----------------------------------------
   CHECK EXISTING SESSION
----------------------------------------- */

async function checkExistingSession(){

  try{

    if(!DB || !DB.auth){

      return;

    }


    const {
      data
    } =
    await DB.auth.getSession();


    if(data && data.session){

      /*
        Already logged in.
        Go directly to Office Admin.
      */

      window.location.replace(
        "admin.html"
      );

      return;

    }


    $("email").focus();


  }catch(error){

    console.error(
      "Session check error:",
      error
    );

  }

}


checkExistingSession();

</script>

</body>
</html>
