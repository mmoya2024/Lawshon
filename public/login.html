<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login — Lashawn Driving & Computer College</title>

    <style>
        :root {
            --blue: #1455d9;
            --dark: #0b1730;
            --border: #dfe5ee;
            --text: #172033;
            --muted: #697386;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0b1730 0%,
                    #12356e 55%,
                    #1455d9 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        .wrap {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        .brand img {
            height: 84px;
            max-width: 160px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
        }

        .brand h1 span {
            color: #6ee7a1;
        }

        .brand p {
            margin: 6px 0 0;
            color: #cbd7e8;
            font-size: 13px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .28);
        }

        .card h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .sub {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font: inherit;
            color: var(--text);
            background: #fff;
        }

        .field input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(20, 85, 217, .1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--blue);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 13px 16px;
            background: var(--blue);
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .forgot-button {
            width: 100%;
            margin-top: 14px;
            border: 0;
            background: transparent;
            color: var(--blue);
            cursor: pointer;
            font-size: 13px;
        }

        .notice {
            padding: 11px 13px;
            border-radius: 9px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.45;
        }

        .notice.error {
            background: #fdecec;
            color: #9d2020;
        }

        .notice.success {
            background: #e8f7ee;
            color: #126d35;
        }

        .notice.info {
            background: #eaf1ff;
            color: #1f4da6;
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            color: #cbd7e8;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 18px;
        }

        .footer a {
            color: #fff;
            text-decoration: none;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: -3px;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="wrap">

    <div class="brand">

        <img
            src="images/logo.png"
            alt="Lashawn Academy logo"
            onerror="this.style.display='none'"
        >

        <h1>
            Lashawn <span>Academy</span>
        </h1>

        <p>
            Driving School &amp; Computer College
        </p>

    </div>


    <div class="card">

        <h2>Staff Login</h2>

        <p class="sub">
            Sign in to manage students, enrolments,
            fees and payments.
        </p>


        <div
            id="notice"
            class="hidden"
            role="alert"
            aria-live="polite"
        ></div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword"
                        class="show-button"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                id="loginButton"
                type="submit"
                class="login-button"
            >
                Sign In
            </button>


            <button
                id="forgotButton"
                type="button"
                class="forgot-button"
            >
                Forgot password?
            </button>

        </form>

    </div>


    <div class="footer">

        Lashawn Driving &amp; Computer College

        <br>

        <a href="index.html">
            &larr; Back to website
        </a>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
"use strict";


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://qjfinbftcserrjiedduf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tzXXoqZwC2SXZwhS8km2FQ_pNQcuCW5";


let DB = null;


if (typeof window.supabase === "undefined") {

    console.error(
        "Supabase CDN failed to load."
    );

} else {

    try {

        DB = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log(
            "Lashawn login Supabase client ready."
        );

    } catch (error) {

        console.error(
            "Supabase client creation failed:",
            error
        );

    }

}


/* =========================================================
   ELEMENTS
   ========================================================= */

const notice =
    document.getElementById("notice");

const form =
    document.getElementById("loginForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const showPassword =
    document.getElementById("showPassword");

const forgotButton =
    document.getElementById("forgotButton");


/* =========================================================
   NOTICE
   ========================================================= */

function message(text, type) {

    notice.className =
        "notice " + type;

    notice.textContent =
        text;

}


/* =========================================================
   BUSY
   ========================================================= */

function setBusy(value) {

    loginButton.disabled =
        value;

    if (value) {

        loginButton.innerHTML =
            '<span class="spinner"></span>Signing in...';

    } else {

        loginButton.textContent =
            "Sign In";

    }

}


/* =========================================================
   STAFF ACCESS
   ========================================================= */

function isStaff(user) {

    if (!user) {
        return false;
    }

    const app =
        user.app_metadata || {};

    const meta =
        user.user_metadata || {};


    const role =
        app.role ||
        meta.role ||
        "";

    const accountType =
        app.account_type ||
        meta.account_type ||
        "";

    const officeRole =
        meta.office_role ||
        "";


    console.log(
        "ROLE:",
        role
    );

    console.log(
        "ACCOUNT TYPE:",
        accountType
    );

    console.log(
        "OFFICE ROLE:",
        officeRole
    );


    return (

        role === "admin" ||
        role === "staff" ||

        accountType === "admin" ||
        accountType === "staff" ||

        officeRole === "Office Admin"

    );

}


/* =========================================================
   ERROR
   ========================================================= */

function errorMessage(error) {

    const text =
        error && error.message
            ? error.message
            : "Unable to sign in.";


    const lower =
        text.toLowerCase();


    if (
        lower.includes(
            "invalid login credentials"
        )
    ) {

        return "Invalid email or password.";

    }


    if (
        lower.includes(
            "email not confirmed"
        )
    ) {

        return "Email confirmation is required.";

    }


    if (
        lower.includes(
            "failed to fetch"
        )
    ) {

        return "Network error. Check your internet connection.";

    }


    return text;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(event) {

    event.preventDefault();


    const emailValue =
        email.value.trim();

    const passwordValue =
        password.value;


    if (!emailValue) {

        message(
            "Please enter your email address.",
            "error"
        );

        email.focus();

        return;

    }


    if (!passwordValue) {

        message(
            "Please enter your password.",
            "error"
        );

        password.focus();

        return;

    }


    if (!DB) {

        message(
            "Supabase connection is unavailable.",
            "error"
        );

        return;

    }


    setBusy(true);


    try {

        console.log(
            "Attempting Supabase login..."
        );


        const result =
            await DB.auth.signInWithPassword({

                email: emailValue,

                password: passwordValue

            });


        if (result.error) {

            throw result.error;

        }


        const user =
            result.data.user;


        const session =
            result.data.session;


        if (!user || !session) {

            throw new Error(
                "Authentication succeeded but no session was created."
            );

        }


        console.log(
            "LOGIN SUCCESS:",
            user.email
        );


        console.log(
            "USER METADATA:",
            user.user_metadata
        );


        console.log(
            "APP METADATA:",
            user.app_metadata
        );


        if (!isStaff(user)) {

            await DB.auth.signOut();


            throw new Error(
                "This account does not have Office Admin access."
            );

        }


        message(
            "Login successful. Opening Office Admin...",
            "success"
        );


        /*
         * Only redirect AFTER successful authentication
         * and successful Office Admin access check.
         */

        setTimeout(
            function () {

                window.location.href =
                    "admin.html";

            },
            700
        );


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        message(
            errorMessage(error),
            "error"
        );


        setBusy(false);

    }

}


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

async function forgotPassword() {

    const emailValue =
        email.value.trim();


    if (!emailValue) {

        message(
            "Enter your email address first.",
            "info"
        );

        email.focus();

        return;

    }


    if (!DB) {

        message(
            "Supabase connection is unavailable.",
            "error"
        );

        return;

    }


    try {

        const result =
            await DB.auth.resetPasswordForEmail(
                emailValue,
                {
                    redirectTo:
                        window.location.origin +
                        "/login.html"
                }
            );


        if (result.error) {

            throw result.error;

        }


        message(
            "If the account exists, a password reset link has been sent.",
            "success"
        );


    } catch (error) {

        console.error(
            "PASSWORD RESET ERROR:",
            error
        );


        message(
            errorMessage(error),
            "error"
        );

    }

}


/* =========================================================
   SHOW PASSWORD
   ========================================================= */

showPassword.addEventListener(
    "click",
    function () {

        if (
            password.type === "password"
        ) {

            password.type =
                "text";

            showPassword.textContent =
                "Hide";

        } else {

            password.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* =========================================================
   EVENTS
   ========================================================= */

form.addEventListener(
    "submit",
    login
);


forgotButton.addEventListener(
    "click",
    forgotPassword
);


/* =========================================================
   IMPORTANT:
   NO AUTOMATIC SESSION REDIRECT HERE.
   ========================================================= */

console.log(
    "Lashawn login page ready."
);

email.focus();

</script>

</body>
</html>
